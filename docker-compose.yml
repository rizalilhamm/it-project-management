version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: itpm
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/itpm
      JWT_SECRET: change_this_secret
    ports:
      - "3000:3000"
    depends_on:
      - db
volumes:
  db-data:
